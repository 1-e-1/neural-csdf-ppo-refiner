seed: 20260724
scene:
  physics_dt_s: 0.008333333333333333
  obstacle_update_hz: 50
  contact_threshold_n: 0.001
  safety_clearance_m: 0.03
  base_exclusion_radius_m: 0.16
  workspace:
    x: [-0.42, 0.42]
    y: [-0.42, 0.42]
    z: [0.08, 0.62]

static_obstacles:
  count_range: [1, 3]
  size_range_m:
    x: [0.06, 0.10]
    y: [0.06, 0.12]
    z: [0.10, 0.18]
  default:
    name: static_obstacle_0
    shape: cuboid
    size_m: [0.06, 0.08, 0.10]
    position_m: [0.25, 0.20, 0.28]
    quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]

dynamic_obstacles:
  count_range: [1, 2]
  size_range_m:
    x: [0.05, 0.08]
    y: [0.05, 0.08]
    z: [0.05, 0.13]
  speed_range_m_s: [0.08, 0.24]
  prediction_horizon_s: 5.0
  default:
    name: dynamic_obstacle_0
    shape: sphere
    size_m: [0.055, 0.055, 0.055]
    center_m: [-0.20, 0.0, 0.34]
    axis_xyz: [0.0, 1.0, 0.0]
    amplitude_m: 0.28
    frequency_hz: 0.15
    phase_rad: 0.0
    quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]
  motion_model: sinusoidal
  note: Dynamic obstacle pose is a deterministic function of task time and is synchronized with trajectory validation.

space_debris:
  count_range: [1, 2]
  diameter_range_m: [0.045, 0.080]
  speed_range_m_s: [0.10, 0.28]
  corridor_half_length_range_m: [0.10, 0.22]
  motion_model: linear_ping_pong
  note: Small irregular kinematic bodies fly back and forth on bounded 3-D corridors.

# Physics-safe randomization: all collision shapes are spawned before SimulationContext.reset().
# Each episode activates a bounded subset and parks the remaining variants outside the workspace.
shape_pool:
  parking_position_m: [8.0, 8.0, 8.0]
  variants:
    - id: static_cuboid_small
      role: static
      shape: cuboid
      size_m: [0.060, 0.080, 0.100]
      color_rgb: [0.12, 0.42, 0.76]
    - id: static_cuboid_medium
      role: static
      shape: cuboid
      size_m: [0.090, 0.120, 0.160]
      color_rgb: [0.18, 0.48, 0.72]
    - id: static_cylinder
      role: static
      shape: cylinder
      size_m: [0.080, 0.080, 0.150]
      color_rgb: [0.16, 0.50, 0.66]
    - id: dynamic_sphere
      role: dynamic
      shape: sphere
      size_m: [0.055, 0.055, 0.055]
      color_rgb: [0.88, 0.26, 0.16]
    - id: dynamic_capsule
      role: dynamic
      shape: capsule
      size_m: [0.065, 0.065, 0.120]
      color_rgb: [0.92, 0.34, 0.12]
    - id: dynamic_cuboid
      role: dynamic
      shape: cuboid
      size_m: [0.075, 0.075, 0.110]
      color_rgb: [0.82, 0.20, 0.22]
    - id: debris_asteroid_small
      role: debris
      shape: asteroid
      size_m: [0.045, 0.045, 0.045]
      roughness_seed: 11
      color_rgb: [0.34, 0.36, 0.38]
    - id: debris_asteroid_medium
      role: debris
      shape: asteroid
      size_m: [0.062, 0.062, 0.062]
      roughness_seed: 23
      color_rgb: [0.42, 0.39, 0.36]
    - id: debris_asteroid_large
      role: debris
      shape: asteroid
      size_m: [0.080, 0.080, 0.080]
      roughness_seed: 37
      color_rgb: [0.30, 0.31, 0.33]

task_sampling:
  min_start_goal_tcp_distance_m: 0.10
  min_tcp_obstacle_clearance_m: 0.10
  min_robot_obstacle_endpoint_clearance_mode: physx_contact_free
  max_scene_resample_attempts: 300
  max_obstacle_diameter_m: 0.18
  max_workspace_occupancy_ratio: 0.18
  expert_feasibility_required: true
  curriculum:
    - name: static_single
      static_count: 1
      dynamic_count: 0
    - name: static_multi
      static_count: [1, 3]
      dynamic_count: 0
    - name: dynamic_single
      static_count: [0, 2]
      dynamic_count: 1
    - name: dynamic_multi
      static_count: [1, 3]
      dynamic_count: [1, 2]

camera:
  name: wrist_camera
  parent_body: foot_1
  prim_path: /World/Robot/foot_1/WristCamera
  offset:
    position_m: [0.060, 0.0, 0.050]
    quaternion_wxyz: [0.3826834324, 0.0, 0.9238795325, 0.0]
    convention: ros
  width: 256
  height: 256
  update_period_s: 0.05
  data_types:
    - rgb
    - distance_to_image_plane
    - semantic_segmentation
  pinhole:
    focal_length_mm: 18.0
    focus_distance_mm: 400.0
    horizontal_aperture_mm: 20.955
    clipping_range_m: [0.03, 2.0]
  depth_clipping_behavior: max
  temporal_frames: 2
  frame_interval_s: 0.10
  noise:
    rgb_gaussian_std_255: 2.0
    depth_gaussian_std_m: 0.003
    depth_dropout_probability: 0.01

fixed_cameras:
  enabled: true
  view_order: [wrist, front, side, top]
  cameras:
    front:
      prim_path: /World/FixedCameras/FrontCamera
      position_m: [0.85, 0.0, 0.48]
      look_at_m: [0.0, 0.0, 0.34]
    side:
      prim_path: /World/FixedCameras/SideCamera
      position_m: [0.0, 0.85, 0.48]
      look_at_m: [0.0, 0.0, 0.34]
    top:
      prim_path: /World/FixedCameras/TopCamera
      position_m: [0.0, 0.0, 1.05]
      look_at_m: [0.0, 0.0, 0.28]

observation_contract:
  privileged_obstacle_token:
    max_obstacles: 5
    per_obstacle_fields:
      - obstacle_role_code_0_static_1_dynamic_2_debris
      - size_xyz
      - position_xyz
      - quaternion_wxyz
      - linear_velocity_xyz
    per_obstacle_dim: 14
    tensor_shape: [5, 14]
    mask_shape: [5]
  vision:
    rgb_shape: [2, 128, 128, 3]
    depth_shape: [2, 128, 128, 1]
    semantic_shape: [2, 128, 128, 1]
  multi_view_vision:
    view_order: [wrist, front, side, top]
    rgb_shape: [4, 2, 128, 128, 3]
    depth_shape: [4, 2, 128, 128, 1]
    semantic_shape: [4, 2, 128, 128, 1]
  base_condition_dim: 9
  note: q_goal remains label-only; neither privileged nor visual model receives q_goal.

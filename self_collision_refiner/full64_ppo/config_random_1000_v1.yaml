seed: 20260810
device: cuda:0

models:
  csdf_checkpoint: ../checkpoints/neural_csdf.pt
  kinematic_chain: ../../../configs/kinematic_chain.json

random_task_generation:
  source_dataset: ../../data/visual_five_view_v1_merged
  source_split: test
  tasks: 1000
  proposal_batch_size: 1024
  maximum_attempt_batches: 150
  minimum_joint_distance_rad: 0.5
  min_duration_s: 0.8
  nominal_max_duration_s: 5.0
  max_output_duration_s: 30.0
  output: data/random_endpoint_safe_1000_v1.npz
  report: outputs/random_endpoint_safe_1000_v1_generation.json

geometry:
  capsule_radius_m: 0.045
  environment_capsule_radius_m: 0.050
  adjacency: 2
  required_clearance_m: 0.010
  exact_query_batch_size: 8192
  continuous_check_max_joint_step_rad: 0.025
  near_boundary_extra_subdivisions: 2

limits:
  velocity: [2.0, 2.0, 2.0, 2.5, 2.5, 3.0]
  acceleration: [8.0, 8.0, 8.0, 10.0, 10.0, 12.0]
  jerk: [80.0, 80.0, 80.0, 100.0, 100.0, 120.0]

refiner:
  input_points: 64
  output_points: 1024
  control_points: 64
  derivative_reference_points: 256
  episode_steps: 8
  action_step_rad: 0.04
  max_residual_rad: 0.45
  initial_corruption_rad: 0.0
  required_clearance_m: 0.010
  gamma: 0.99
  proxy_scales:
    acceleration: 0.000010
    jerk: 0.000005
    oscillation: 0.000050
  reward_weights:
    clearance: 1.5
    collision_fraction: 3.0
    deviation: 0.50
    acceleration: 0.60
    jerk: 0.40
    oscillation: 1.00
    action: 0.02
    action_oscillation: 0.05
    success: 5.0

ppo:
  hidden_dim: 768
  initial_std: 0.25
  checkpoint: checkpoints/trajectory_refiner_full64_smooth_1024_v3.pt

evaluation:
  input: data/random_endpoint_safe_1000_v1.npz
  output: outputs/random_endpoint_safe_1000_v1_refined.npz
  report: outputs/random_endpoint_safe_1000_v1_evaluation.json
  batch_size: 64
  dynamics_reference_points: 1024
  environment_check_points: 256
  robot_limits: ../../../configs/robot.yaml
  time_scaling:
    retime_after_refinement: true
    timing_points: 1024
    min_duration_s: 0.8
    nominal_max_duration_s: 5.0
    max_output_duration_s: 30.0

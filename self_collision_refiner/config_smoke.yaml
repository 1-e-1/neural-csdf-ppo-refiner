seed: 20260802
device: cuda:0
geometry:
  kinematic_chain: ../../configs/kinematic_chain.json
  capsule_radius_m: 0.045
  adjacency: 2
  required_clearance_m: 0.010
  exact_query_batch_size: 2048
  continuous_check_max_joint_step_rad: 0.050
  near_boundary_extra_subdivisions: 1
csdf_dataset:
  samples: 4096
  collision_margin_m: 0.010
  boundary_width_m: 0.030
  boundary_fraction: 0.35
  target_safe_fraction: 0.25
  perturbation_std_rad: 0.10
  output: data/smoke_cspace_self_collision.npz
  report: outputs/smoke_cspace_dataset_report.json
csdf_training:
  hidden_dims: [128, 128, 64]
  epochs: 5
  batch_size: 512
  learning_rate: 0.0005
  weight_decay: 0.00001
  validation_fraction: 0.15
  clearance_loss_weight: 1.0
  collision_loss_weight: 0.25
  boundary_weight_gain: 4.0
  boundary_temperature_m: 0.030
  clearance_scale_m: 0.10
  checkpoint: checkpoints/smoke_neural_csdf.pt
  report: outputs/smoke_neural_csdf_training.json
refiner:
  source_dataset: ../data/visual_five_view_v1_merged
  max_source_trajectories: 64
  input_points: 64
  output_points: 256
  control_points: 16
  episode_steps: 4
  action_step_rad: 0.10
  max_residual_rad: 0.45
  initial_corruption_rad: 0.65
  required_clearance_m: 0.010
  gamma: 0.99
  reward_weights:
    clearance: 1.0
    collision_fraction: 3.0
    deviation: 0.20
    acceleration: 0.08
    jerk: 0.02
    action: 0.01
    success: 5.0
ppo:
  environments: 16
  updates: 3
  hidden_dim: 128
  initial_std: 0.35
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_ratio: 0.20
  value_weight: 0.50
  entropy_weight: 0.002
  ppo_epochs: 2
  minibatch_size: 32
  max_grad_norm: 1.0
  checkpoint: checkpoints/smoke_trajectory_refiner_ppo.pt
  report: outputs/smoke_trajectory_refiner_ppo_training.json
inference:
  input: ../outputs/evaluation/visual_cfm_five_view_v5_k64_postprocess_selected.npz
  sample_index: 0
  output: outputs/smoke_refined_trajectory_256.npz
  report: outputs/smoke_refined_trajectory_256_report.json
